name: Feature request
description: Suggest an API, relay feature or docs improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the use case before the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: API sketch, config, or wire-format change (link the protocol section if relevant).
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

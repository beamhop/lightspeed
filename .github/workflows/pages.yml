name: Pages

# Docs at the site root (/lightspeed/), the demo at /lightspeed/demo/.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  ASTRO_TELEMETRY_DISABLED: '1'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/configure-pages@v5
      - run: bun install --frozen-lockfile
      - name: Build docs
        run: bun run --cwd apps/docs build
      - name: Build demo
        run: bun run --cwd apps/demo build
      - name: Place demo at /demo inside the docs site
        run: |
          rm -rf apps/docs/dist/demo
          mkdir -p apps/docs/dist/demo
          cp -R apps/demo/dist/. apps/docs/dist/demo/
          test -f apps/docs/dist/index.html
          test -f apps/docs/dist/demo/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
